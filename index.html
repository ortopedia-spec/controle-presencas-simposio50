<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#075d43"><link rel="manifest" href="manifest.json">
  <title>Simpósio 50 Anos — Presenças</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--green:#075d43;--green-deep:#043c2b;--ink:#10231d;--muted:#60706b;--line:#d8e1dd;--bg:#f4f7f5;--ok:#087a45;--warn:#a96100;--bad:#963d3d;--orange:#ff8a1c;--yellow:#ffe70a;--red:#ed1c2e}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink)}main{max-width:680px;margin:auto;padding:10px 12px 28px}header{padding:12px 13px;background:linear-gradient(135deg,var(--green-deep),var(--green));border-radius:18px;box-shadow:0 7px 20px #043c2b24}.brand{display:flex;align-items:center;gap:12px}.brand-logo{width:78px;height:46px;object-fit:contain;object-position:center;background:#050505;border-radius:10px;padding:4px}.brand-copy{min-width:0}h1{font-size:24px;line-height:1.05;margin:0;color:#fff;font-weight:800;letter-spacing:-.5px}.sub{color:#dcebe4;margin-top:3px;font-size:15px}.meta{margin-top:10px;padding:8px 10px;background:#ffffff17;border:1px solid #ffffff1c;border-radius:11px;color:#edf8f2;font-size:13px;display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap}.meta b{color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:10px;margin-top:10px;box-shadow:0 2px 8px #1830260b}.scanner-card{padding:10px}.scanner-card:has(#reader:empty){padding-bottom:10px}#reader{overflow:hidden;border-radius:12px;min-height:0;background:#10231d}#reader:empty{display:none}#reader:not(:empty){height:clamp(190px,31vh,245px);margin-bottom:9px}#reader video,#reader img{width:100%!important;height:100%!important;object-fit:cover;border-radius:12px}.actions{display:flex;gap:8px}.actions button{flex:1}button,input{font:inherit}button{border:0;border-radius:10px;padding:11px 13px;background:var(--green);color:#fff;font-weight:750;min-height:45px;cursor:pointer}button.secondary{background:#e8f0ec;color:#164a37}button.stop{background:var(--bad)}button:disabled{opacity:.55;cursor:wait}.search-card{padding:9px}.search{display:flex;align-items:stretch;gap:7px}.search input{min-width:0;flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:45px}.search button{flex:0 0 auto;min-width:94px}.result{border-left:6px solid var(--ok);padding:15px;background:#f3fbf6;border-radius:10px;margin-top:10px}.result.warn{border-color:#e4a230;background:#fff8e9}.result.error{border-color:var(--bad);background:#fff3f2}.result h2{margin:0 0 6px;font-size:20px}.result .person{font-size:24px;font-weight:800}.detail{color:#4f645c;margin-top:4px}.list{display:grid;gap:8px;margin-top:8px}.person-card{border:1px solid var(--line);padding:12px;border-radius:10px}.person-card strong{font-size:18px}.person-card small{display:block;color:var(--muted);margin:3px 0 9px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,420px);background:#fff;border-radius:16px;padding:20px}.modal h2{margin:0}.modal p{color:var(--muted)}.modal label{font-size:13px;font-weight:700;display:block;margin-top:11px}.modal input{width:100%;border:1px solid var(--line);padding:12px;border-radius:9px;margin-top:4px}.modal button{width:100%;margin-top:15px}.status{font-size:13px;color:var(--muted);margin:9px 3px 0;text-align:center}@media(max-width:380px){main{padding:8px 9px 22px}header{padding:10px 11px;border-radius:15px}.brand{gap:9px}.brand-logo{width:69px;height:42px}h1{font-size:21px}.sub{font-size:14px}.meta{font-size:12px;padding:7px 8px}.card{margin-top:8px}.scanner-card{padding:8px}#reader:not(:empty){height:190px}.search button{min-width:82px;padding-inline:10px}}
  </style>
</head>
<body><main>
  <header><div class="brand"><img class="brand-logo" src="assets/logo-sorri-50.png" alt="SORRI 50 anos"><div class="brand-copy"><h1>Simpósio 50 Anos</h1><div class="sub">Controle de Presenças</div></div></div><div class="meta"><span>Operador: <b id="operator">—</b> · <b id="device">—</b></span><span id="clock">—</span></div></header>
  <section class="card scanner-card"><div id="reader"></div><div class="actions"><button id="start">📷 Iniciar câmera</button><button id="stop" class="stop hidden">■ Parar câmera</button></div></section>
  <section class="card search-card"><div class="search"><input id="search" autocomplete="off" placeholder="Buscar participante" aria-label="Buscar participante"><button id="searchBtn" class="secondary">Buscar</button></div><div id="matches" class="list"></div></section>
  <div id="feedback" class="hidden"></div><div class="status" id="status">Preparando base local…</div>
</main>
<div class="overlay hidden" id="identity"><div class="modal"><h2>Identificação</h2><p>Informe uma vez para este aparelho.</p><label for="operatorInput">Operador</label><input id="operatorInput" maxlength="80" autocomplete="name"><label for="deviceInput">Dispositivo</label><input id="deviceInput" maxlength="80" placeholder="Ex.: Celular 01"><button id="saveIdentity">Continuar</button></div></div>
<script>
  const API_URL='https://script.google.com/macros/s/AKfycbyr6Uu1NE2M6UE3i2X92qNQgih3Ky9OCAYpXqmo3L2fGry2GhIGVPn43mDOp_IFd1Cl/exec';
  const APP_VERSION='2026.09.12.2', CACHE_KEY='simposio50.indice.'+APP_VERSION, ID_KEY='simposio50.identidade';
  let scanner=null, scanning=false, busy=false, identity={}, localIndex=null;
  const $=id=>document.getElementById(id), escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(action, body={}){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body})});const j=await r.json();if(!j.ok)throw new Error(j.error?.message||'Falha na comunicação.');return j.data}
  function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim()}
  function indiceCompativel(cached,baseVersion){return !!cached&&cached.appVersion===APP_VERSION&&String(cached.baseVersion)===String(baseVersion)&&Array.isArray(cached.pessoas)&&!!cached.inscricaoParaPessoa&&typeof cached.inscricaoParaPessoa==='object'&&cached.pessoas.every(p=>p&&['nome','nomeCracha','nomeExibicao'].every(c=>typeof p[c]==='string'))}
  function filtrarIndiceLocal(indice,termo){const partes=norm(termo).split(' ').filter(Boolean);return !indice||!partes.length?[]:indice.pessoas.filter(p=>partes.every(x=>norm([p.nome,p.nomeCracha,p.nomeExibicao].join(' ')).includes(x))).slice(0,30)}
  async function buscarComFallback(termo,indice,consultar){const locais=filtrarIndiceLocal(indice,termo);return locais.length?locais:consultar(termo)}
  function updateIdentity(){identity=JSON.parse(localStorage.getItem(ID_KEY)||'{}');$('operator').textContent=identity.operador||'—';$('device').textContent=identity.dispositivo||'—';$('identity').classList.toggle('hidden',!!(identity.operador&&identity.dispositivo))}
  function show(message,kind='ok',person='',detail=''){const el=$('feedback');el.className='result '+(kind==='warn'?'warn':kind==='error'?'error':'');el.innerHTML='<h2>'+message+'</h2>'+(person?'<div class="person">'+escape(person)+'</div>':'')+(detail?'<div class="detail">'+escape(detail)+'</div>':'');}
  function clearFeedback(){ $('feedback').className='hidden'; $('feedback').innerHTML=''; }
  async function checkVersion(){try{const v=await fetch('version.json',{cache:'no-store'}).then(r=>r.json());if(v.version&&v.version!==APP_VERSION&&!location.search.includes('v='+encodeURIComponent(v.version)))location.replace(location.pathname+'?v='+encodeURIComponent(v.version));}catch(_){} }
  async function loadIndex(){let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){}try{const status=await api('obterBaseVersion');if(indiceCompativel(cached,status.baseVersion)){localIndex=cached;$('status').textContent='Base local pronta';return}const fresh=await api('obterIndiceParticipantes'),atualizado={...fresh,appVersion:APP_VERSION};localStorage.setItem(CACHE_KEY,JSON.stringify(atualizado));localIndex=atualizado;$('status').textContent='Base atualizada';}catch(e){if(indiceCompativel(cached,cached?.baseVersion)){localIndex=cached;$('status').textContent='Usando base local; servidor indisponível'}else{$('status').textContent='Base será consultada no servidor'}}}
  function fromLocal(number){const hit=localIndex?.inscricaoParaPessoa?.[String(number).replace(/\s/g,'')];if(!hit)return null;const p=localIndex.pessoas.find(x=>x.idPessoa===hit.idPessoa);return p?{...p,numeroInscricaoLido:number,categoriaInscricaoLida:hit.categoria}:null}
  async function processQR(decoded){if(busy)return;busy=true;const qr=String(decoded).trim();show('Consultando…','ok');try{const p=fromLocal(qr)||await api('buscarPorInscricao',{numeroInscricao:qr});await register({origemRegistro:'QR',numeroInscricao:qr},p)}catch(e){show('❌ QR não localizado','error','',e.message);rearm(2200)}}
  async function register(payload,person){try{const r=await api('registrarPresenca',{...payload,operador:identity.operador,dispositivo:identity.dispositivo});const p=r.participante||person;const d=r.presenca;if(r.status==='DUPLICADA')show('⚠️ Presença já registrada','warn',p.nomeExibicao,'Registro original: '+d.data+' · '+d.hora+' · '+d.periodo);else show('✅ Presença registrada','ok',p.nomeExibicao,d.data+' · '+d.periodo+' · '+d.hora);$('matches').innerHTML='';rearm(2100)}catch(e){show('❌ Não foi possível registrar','error',person?.nomeExibicao||'',e.message);rearm(2500)}}
  function rearm(ms){setTimeout(()=>{busy=false;if(scanning)clearFeedback()},ms)}
  async function start(){if(scanning)return;try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},processQR,()=>{});scanning=true;$('start').classList.add('hidden');$('stop').classList.remove('hidden');}catch(e){show('❌ Câmera indisponível','error','',e.message)}}
  async function stop(){if(!scanner)return;try{await scanner.stop();await scanner.clear()}finally{scanner=null;scanning=false;$('start').classList.remove('hidden');$('stop').classList.add('hidden')}}
  async function search(){const q=$('search').value.trim();if(q.length<2){show('Digite ao menos 2 caracteres','error');return}try{const people=await buscarComFallback(q,localIndex,async termo=>(await api('buscarParticipantes',{termo})).participantes);renderMatches(people)}catch(e){show('❌ Busca indisponível','error','',e.message)}}
  function renderMatches(people){const box=$('matches');if(!people.length){box.innerHTML='<div class="detail">Nenhum participante encontrado.</div>';return}box.innerHTML=people.map((p,i)=>'<div class="person-card"><strong>'+escape(p.nomeExibicao)+'</strong>'+(p.nome&&p.nome!==p.nomeExibicao?'<small>Cadastro: '+escape(p.nome)+'</small>':'')+'<button data-index="'+i+'">REGISTRAR PRESENÇA</button></div>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>register({origemRegistro:'BUSCA_NOME',idPessoa:people[Number(b.dataset.index)].idPessoa},people[Number(b.dataset.index)]))}
  $('start').onclick=start;$('stop').onclick=stop;$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};$('saveIdentity').onclick=()=>{const operador=$('operatorInput').value.trim(),dispositivo=$('deviceInput').value.trim();if(!operador||!dispositivo)return;$('operatorInput').value='';localStorage.setItem(ID_KEY,JSON.stringify({operador,dispositivo}));updateIdentity()};
  setInterval(()=>{$('clock').textContent=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);checkVersion();updateIdentity();loadIndex();
</script></body></html>
