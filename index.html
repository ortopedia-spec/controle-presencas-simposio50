ground:var(--warn)}.base-tools{display:flex;justify-content:center;gap:8px;margin:8px 3px 0}.base-tool{display:inline-flex;align-items:center;justify-content:center;min-height:38px;padding:7px 12px;border:1px solid #d9dde6;border-radius:12px;background:#fff;color:#46536a;font-size:13px;font-weight:750;line-height:1;text-decoration:none;box-shadow:0 2px 7px #1018280b;cursor:pointer}.base-tool:focus-visible{outline:2px solid #ed1c2e66;outline-offset:2px}.base-tool:disabled{opacity:.6;cursor:wait}.base-tool .spinner{width:14px;height:14px;margin-right:6px}@media(max-width:380px){main{padding:10px 10px 28px}.brand{gap:4px;min-height:80px}.brand-symbol{width:78px;height:53px}.brand-anniversary{width:54px;height:66px}h1{font-size:27px}.sub{font-size:15px}.meta{font-size:12px;padding:9px 11px;gap:4px}.meta .meta-icon{font-size:15px}.clock-wrap{padding-left:6px}.search{gap:7px}.search input{font-size:16px;padding-left:45px}.search:before{left:14px;font-size:32px}.search button{min-width:94px;font-size:16px;padding-inline:10px}.person-card{padding-left:73px}.person-card:before{left:14px}.person-card button{width:calc(100% + 59px);margin-left:-59px;font-size:16px}#reader:not(:empty){height:185px}.base-tool{padding-inline:10px;font-size:12px}}@media(max-width:335px){.meta{flex-wrap:wrap;border-radius:22px}.clock-wrap{padding-left:0;border-left:0}}

<script>
  const API_URL='https://script.google.com/macros/s/AKfycbyr6Uu1NE2M6UE3i2X92qNQgih3Ky9OCAYpXqmo3L2fGry2GhIGVPn43mDOp_IFd1Cl/exec';
  const APP_VERSION='2026.09.14.4', CACHE_KEY='simposio50.indice', LEGACY_CACHE_PREFIX='simposio50.indice.', ID_KEY='simposio50.identidade', QR_COOLDOWN_MS=2600;
  const BACKGROUND_REFRESH_OPERATION_LIMIT=15, BACKGROUND_REFRESH_INTERVAL_MS=5*60*1000, BACKGROUND_REFRESH_JITTER_MAX_MS=2000;
  const BUSY_STATES=new Set(['QR_DETECTED','PROCESSING_QR','SEARCHING','PROCESSING_RESULT']);
  let scanner=null, scanning=false, busy=false, operationState='IDLE', lastQrPayload='', lastQrSeenAt=0, feedbackTimer=null, identity={}, localIndex=null;
  let operationsSinceVersionCheck=0, lastBaseVersionCheckAt=Date.now(), backgroundRefreshTimer=null, backgroundRefreshJitterTimer=null, isBackgroundRefreshRunning=false, isBackgroundRefreshScheduled=false, backgroundRefreshPromise=null, manualRefreshPromise=null;
  const $=id=>document.getElementById(id), escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function erroComCodigo_(codigo,mensagem,causa){const erro=new Error(mensagem);erro.code=codigo;if(causa)erro.cause=causa;return erro}
  async function api(action, body={}){let r;try{r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body})})}catch(causa){throw erroComCodigo_('NETWORK_ERROR','Falha de rede ao consultar o servidor.',causa)}if(!r.ok)throw erroComCodigo_('HTTP_ERROR','Falha HTTP '+r.status+'.');let j;try{j=await r.json()}catch(causa){throw erroComCodigo_('PARSE_ERROR','Resposta inválida do servidor.',causa)}if(!j.ok)throw erroComCodigo_('HTTP_ERROR',j.error?.message||'Falha na comunicação.');return j.data}
  function aguardar_(ms){return new Promise(resolve=>setTimeout(resolve,ms))}
  function falhaTransitoriaLeitura_(erro){return['NETWORK_ERROR','HTTP_ERROR','PARSE_ERROR'].includes(erro?.code)}
  async function apiLeituraComRetry_(action,body={}){let ultima;for(let tentativa=0;tentativa<2;tentativa++){try{return await api(action,body)}catch(erro){ultima=erro;if(tentativa===1||!falhaTransitoriaLeitura_(erro))throw erro;console.warn('[BASE_RETRY]',{action,codigo:erro.code,tentativa:tentativa+1});await aguardar_(300)}}throw ultima}
  function erroEtapaLeitura_(codigo,erro){const falha=erroComCodigo_(codigo,erro?.message||'Falha na leitura da base.',erro);falha.causeCode=erro?.code||'UNKNOWN_ERROR';return falha}
  function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim()}
  function versaoBaseValida_(value){return value!==undefined&&value!==null&&String(value).trim()!==''}
  function indiceEstruturalmenteValido_(cached){return !!cached&&versaoBaseValida_(cached.baseVersion)&&Array.isArray(cached.pessoas)&&!!cached.inscricaoParaPessoa&&typeof cached.inscricaoParaPessoa==='object'&&!Array.isArray(cached.inscricaoParaPessoa)&&cached.pessoas.every(p=>p&&typeof p.idPessoa==='string'&&p.idPessoa.trim()!==''&&['nome','nomeCracha','nomeExibicao'].every(c=>typeof p[c]==='string')&&Array.isArray(p.nomesBusca)&&p.nomesBusca.every(nome=>typeof nome==='string'))}
  function indiceCompativel(cached,baseVersion){return indiceEstruturalmenteValido_(cached)&&cached.appVersion===APP_VERSION&&versaoBaseValida_(baseVersion)&&String(cached.baseVersion)===String(baseVersion)}
  function lerIndiceCache_(key){try{return JSON.parse(localStorage.getItem(key)||'null')}catch(_){return null}}
  function compararIndicesLocais_(a,b){const versaoA=Number(a?.baseVersion)||0,versaoB=Number(b?.baseVersion)||0;if(versaoA!==versaoB)return versaoB-versaoA;return String(b?.appVersion||'').localeCompare(String(a?.appVersion||''))}
  function obterIndiceLocalDisponivel_(){const atual=lerIndiceCache_(CACHE_KEY);if(indiceEstruturalmenteValido_(atual))return atual;const candidatos=[];for(let i=0;i<(localStorage.length||0);i++){const key=localStorage.key(i);if(!key||!key.startsWith(LEGACY_CACHE_PREFIX))continue;const candidato=lerIndiceCache_(key);if(indiceEstruturalmenteValido_(candidato))candidatos.push(candidato)}candidatos.sort(compararIndicesLocais_);const legado=candidatos[0]||null;if(legado)localStorage.setItem(CACHE_KEY,JSON.stringify(legado));return legado}
  function filtrarIndiceLocal(indice,termo){const partes=norm(termo).split(' ').filter(Boolean);return !indice||!partes.length?[]:indice.pessoas.filter(p=>partes.every(x=>norm([p.nome,p.nomeCracha,p.nomeExibicao].concat(p.nomesBusca||[]).join(' ')).includes(x))).slice(0,30)}
  async function buscarComFallback(termo,indice,consultar){const locais=filtrarIndiceLocal(indice,termo);return locais.length?locais:consultar(termo)}
  function updateIdentity(){identity=JSON.parse(localStorage.getItem(ID_KEY)||'{}');$('operator').textContent=identity.operador||'—';$('device').textContent=identity.dispositivo||'—';$('identity').classList.toggle('hidden',!!(identity.operador&&identity.dispositivo))}
  function cancelFeedbackTimer_(){if(feedbackTimer!==null){clearTimeout(feedbackTimer);feedbackTimer=null}}
  function show(message,kind='ok',person='',detail=''){cancelFeedbackTimer_();const el=$('feedback');el.className='result '+(kind==='warn'?'warn':kind==='error'?'error':'');el.innerHTML='<h2>'+message+'</h2>'+(person?'<div class="person">'+escape(person)+'</div>':'')+(detail?'<div class="detail">'+escape(detail)+'</div>':'');}
  function clearFeedback(){cancelFeedbackTimer_();$('feedback').className='hidden';$('feedback').innerHTML=''}
  function spinner_(label){return '<span class="spinner" aria-hidden="true"></span>'+label}
  function setOperationalState(next){operationState=next;busy=BUSY_STATES.has(next);const processingQr=next==='QR_DETECTED'||next==='PROCESSING_QR',searching=next==='SEARCHING',stage=$('scannerStage'),stopButton=$('stop'),searchButton=$('searchBtn'),searchInput=$('search');stage?.classList.toggle('scanning',scanning);stage?.classList.toggle('processing',processingQr);stage?.setAttribute('aria-busy',String(processingQr));if(stopButton){stopButton.disabled=busy;stopButton.classList.toggle('busy-label',processingQr);stopButton.innerHTML=processingQr?spinner_('Consultando…'):'■ Parar câmera'}if(searchButton){searchButton.disabled=busy;searchButton.classList.toggle('busy-label',searching);searchButton.setAttribute('aria-busy',String(searching));searchButton.innerHTML=searching?spinner_('Buscando…'):'Buscar'}if(searchInput)searchInput.disabled=busy;document.querySelectorAll?.('.person-card button').forEach(button=>button.disabled=busy)}
  function vibrateQr_(){try{if(typeof navigator!=='undefined'&&typeof navigator.vibrate==='function')navigator.vibrate(40)}catch(_){}}
  function estadoOperacionalAtual_(){return operationState}
  async function checkVersion(){try{const v=await fetch('version.json',{cache:'no-store'}).then(r=>r.json());if(v.version&&v.version!==APP_VERSION&&!location.search.includes('v='+encodeURIComponent(v.version)))location.replace(location.pathname+'?v='+encodeURIComponent(v.version));}catch(_){} }
  function setStatus(message,kind=''){const el=$('status');el.textContent=message;el.className='status '+kind}
  function agendarVerificacaoTemporal_(){if(backgroundRefreshTimer!==null)clearTimeout(backgroundRefreshTimer);const espera=Math.max(0,BACKGROUND_REFRESH_INTERVAL_MS-(Date.now()-lastBaseVersionCheckAt));backgroundRefreshTimer=setTimeout(()=>{backgroundRefreshTimer=null;solicitarAtualizacaoSilenciosa_('tempo')},espera)}
  function reiniciarJanelaVerificacaoBase_(){operationsSinceVersionCheck=0;lastBaseVersionCheckAt=Date.now();agendarVerificacaoTemporal_()}
  function cancelarAtualizacaoAgendada_(){if(backgroundRefreshTimer!==null){clearTimeout(backgroundRefreshTimer);backgroundRefreshTimer=null}if(backgroundRefreshJitterTimer!==null){clearTimeout(backgroundRefreshJitterTimer);backgroundRefreshJitterTimer=null}isBackgroundRefreshScheduled=false}
  function solicitarAtualizacaoSilenciosa_(motivo){if(isBackgroundRefreshRunning||isBackgroundRefreshScheduled)return false;isBackgroundRefreshScheduled=true;if(backgroundRefreshTimer!==null){clearTimeout(backgroundRefreshTimer);backgroundRefreshTimer=null}const jitter=Math.floor(Math.random()*(BACKGROUND_REFRESH_JITTER_MAX_MS+1));backgroundRefreshJitterTimer=setTimeout(async()=>{backgroundRefreshJitterTimer=null;isBackgroundRefreshScheduled=false;await executarAtualizacaoSilenciosa_(motivo)},jitter);return true}
  function executarAtualizacaoSilenciosa_(motivo){if(isBackgroundRefreshRunning)return backgroundRefreshPromise||Promise.resolve({iniciada:false,motivo:'em_andamento'});isBackgroundRefreshRunning=true;operationsSinceVersionCheck=0;const anterior=localIndex;backgroundRefreshPromise=(async()=>{try{let status;try{status=await apiLeituraComRetry_('obterBaseVersion')}catch(erro){throw erroEtapaLeitura_('VERSION_CHECK_FAILED',erro)}if(!versaoBaseValida_(status?.baseVersion))throw erroComCodigo_('VERSION_CHECK_FAILED','Versão da base inválida.');if(anterior&&String(anterior.baseVersion)===String(status.baseVersion))return{iniciada:true,atualizada:false,motivo};let fresh;try{fresh=await apiLeituraComRetry_('obterIndiceParticipantes')}catch(erro){throw erroEtapaLeitura_('INDEX_DOWNLOAD_FAILED',erro)}const preparado={...fresh,appVersion:APP_VERSION};if(!indiceCompativel(preparado,status.baseVersion))throw erroComCodigo_('INDEX_INVALID','Índice de participantes inválido.');localStorage.setItem(CACHE_KEY,JSON.stringify(preparado));localIndex=preparado;if(motivo==='inicializacao')setStatus('Base atualizada','ready');return{iniciada:true,atualizada:true,motivo}}catch(erro){console.warn('[BASE_REFRESH_FAILED]',{codigo:erro.code||'UNKNOWN_ERROR',causa:erro.causeCode||erro.cause?.code||''});return{iniciada:true,atualizada:false,falhou:true,motivo,codigo:erro.code||'UNKNOWN_ERROR',causa:erro.causeCode||erro.cause?.code||''}}finally{lastBaseVersionCheckAt=Date.now();isBackgroundRefreshRunning=false;backgroundRefreshPromise=null;if(operationsSinceVersionCheck>=BACKGROUND_REFRESH_OPERATION_LIMIT)solicitarAtualizacaoSilenciosa_('operacoes');else agendarVerificacaoTemporal_()}})();return backgroundRefreshPromise}
  function atualizarBaseManual_(){if(manualRefreshPromise)return manualRefreshPromise;cancelarAtualizacaoAgendada_();const botao=$('refreshBase');manualRefreshPromise=(async()=>{if(botao){botao.disabled=true;botao.innerHTML=spinner_('Atualizando…')}setStatus('Atualizando…');const resultado=await executarAtualizacaoSilenciosa_('manual');if(resultado.falhou)setStatus('Não foi possível atualizar a base','warning');else if(resultado.atualizada)setStatus('Base atualizada','ready');else setStatus('Base já está atualizada','ready');return resultado})().finally(()=>{if(botao){botao.disabled=false;botao.textContent='↻ Atualizar base'}manualRefreshPromise=null});return manualRefreshPromise}
  function registrarOperacaoConcluida_(){operationsSinceVersionCheck++;if(operationsSinceVersionCheck>=BACKGROUND_REFRESH_OPERATION_LIMIT)solicitarAtualizacaoSilenciosa_('operacoes')}
  function estadoSincronizacaoSilenciosa_(){return{operationsSinceVersionCheck,lastBaseVersionCheckAt,isBackgroundRefreshRunning,isBackgroundRefreshScheduled}}
  async function loadIndex(){const cached=obterIndiceLocalDisponivel_();try{let status;try{status=await apiLeituraComRetry_('obterBaseVersion')}catch(erro){throw erroEtapaLeitura_('VERSION_CHECK_FAILED',erro)}if(indiceEstruturalmenteValido_(cached)&&String(cached.baseVersion)===String(status.baseVersion)){localIndex={...cached,appVersion:APP_VERSION};localStorage.setItem(CACHE_KEY,JSON.stringify(localIndex));setStatus('Base local pronta','ready');return}if(indiceEstruturalmenteValido_(cached)){localIndex=cached;setStatus('Base local disponível; atualizando…','warning');executarAtualizacaoSilenciosa_('inicializacao');return}let fresh;try{fresh=await apiLeituraComRetry_('obterIndiceParticipantes')}catch(erro){throw erroEtapaLeitura_('INDEX_DOWNLOAD_FAILED',erro)}const atualizado={...fresh,appVersion:APP_VERSION};if(!indiceCompativel(atualizado,status.baseVersion))throw erroComCodigo_('INDEX_INVALID','Índice de participantes inválido.');localStorage.setItem(CACHE_KEY,JSON.stringify(atualizado));localIndex=atualizado;setStatus('Base atualizada','ready');}catch(erro){console.warn('[BASE_BOOTSTRAP_FAILED]',{codigo:erro.code||'UNKNOWN_ERROR',causa:erro.causeCode||erro.cause?.code||''});if(indiceEstruturalmenteValido_(cached)){localIndex=cached;setStatus('Usando base local; servidor temporariamente indisponível','warning')}else{setStatus('Base será consultada no servidor','warning')}}finally{reiniciarJanelaVerificacaoBase_()}}
  function normalizarQrLido(decoded){const bruto=String(decoded??'').trim();if(/^\d+$/.test(bruto))return bruto;try{const url=new URL(bruto),match=url.hostname.toLowerCase()==='e3.gl'&&url.pathname.match(/^\/[a-f0-9]{8}(\d{8})$/i);return match?match[1]:bruto}catch(_){return bruto}}
  function fromLocal(number){const hit=localIndex?.inscricaoParaPessoa?.[String(number).replace(/\s/g,'')];if(!hit)return null;const p=localIndex.pessoas.find(x=>x.idPessoa===hit.idPessoa);return p?{...p,numeroInscricaoLido:number,categoriaInscricaoLida:hit.categoria}:null}
  async function processQR(decoded){const qr=normalizarQrLido(decoded),now=Date.now();if(qr===lastQrPayload&&now-lastQrSeenAt<QR_COOLDOWN_MS){lastQrSeenAt=now;return}if(busy)return;lastQrPayload=qr;lastQrSeenAt=now;setOperationalState('QR_DETECTED');clearFeedback();vibrateQr_();setOperationalState('PROCESSING_QR');show('Consultando…','ok');try{const p=fromLocal(qr)||await api('buscarPorInscricao',{numeroInscricao:qr});await register({origemRegistro:'QR',numeroInscricao:qr},p)}catch(e){show('❌ QR não localizado','error','',e.message);rearm(2200)}}
  function manterFeedbackDuplicado_(status){return status==='DUPLICADA'}
  async function register(payload,person){const qrFlow=operationState==='PROCESSING_QR';if(!qrFlow){if(busy)return;cancelFeedbackTimer_();setOperationalState('PROCESSING_RESULT')}try{const r=await api('registrarPresenca',{...payload,operador:identity.operador,dispositivo:identity.dispositivo});const p=r.participante||person;const d=r.presenca;if(manterFeedbackDuplicado_(r.status)){show('⚠️ Presença já registrada','warn',p.nomeExibicao,'Registro original: '+d.data+' · '+d.hora+' · '+d.periodo);$('matches').innerHTML='';setOperationalState('DUPLICATE');return}show('✅ Presença registrada','ok',p.nomeExibicao,d.data+' · '+d.periodo+' · '+d.hora);$('matches').innerHTML='';rearm(2100)}catch(e){show('❌ Não foi possível registrar','error',person?.nomeExibicao||'',e.message);rearm(2500)}finally{registrarOperacaoConcluida_()}}
  function rearm(ms){setOperationalState('RESULT');feedbackTimer=setTimeout(()=>{feedbackTimer=null;lastQrSeenAt=Date.now();if(busy)return;setOperationalState(scanning?'SCANNING':'IDLE');if(scanning)clearFeedback()},ms)}
  async function start(){if(scanning||busy)return;try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},processQR,()=>{});scanning=true;$('start').classList.add('hidden');$('stop').classList.remove('hidden');setOperationalState('SCANNING')}catch(e){setOperationalState('IDLE');show('❌ Câmera indisponível','error','',e.message)}}
  async function stop(){if(!scanner||busy)return;try{await scanner.stop();await scanner.clear()}finally{scanner=null;scanning=false;$('start').classList.remove('hidden');$('stop').classList.add('hidden');setOperationalState('IDLE')}}
  async function search(){if(busy)return;const q=$('search').value.trim();if(q.length<2){show('Digite ao menos 2 caracteres','error');return}clearFeedback();setOperationalState('SEARCHING');try{const people=await buscarComFallback(q,localIndex,async termo=>(await api('buscarParticipantes',{termo})).participantes);renderMatches(people)}catch(e){show('❌ Busca indisponível','error','',e.message)}finally{setOperationalState(scanning?'SCANNING':'IDLE')}}
  function renderMatches(people){const box=$('matches');if(!people.length){box.innerHTML='<div class="detail">Nenhum participante encontrado.</div>';return}box.innerHTML=people.map((p,i)=>'<div class="person-card"><div class="person-card-content"><strong>'+escape(p.nomeExibicao)+'</strong>'+(p.nome&&p.nome!==p.nomeExibicao?'<small>Cadastro: '+escape(p.nome)+'</small>':'')+'</div><button data-index="'+i+'">REGISTRAR PRESENÇA</button></div>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>register({origemRegistro:'BUSCA_NOME',idPessoa:people[Number(b.dataset.index)].idPessoa},people[Number(b.dataset.index)]))}
  $('start').onclick=start;$('stop').onclick=stop;$('searchBtn').onclick=search;$('refreshBase').onclick=atualizarBaseManual_;$('search').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();search()}};$('saveIdentity').onclick=()=>{const operador=$('operatorInput').value.trim(),dispositivo=$('deviceInput').value.trim();if(!operador||!dispositivo)return;$('operatorInput').value='';localStorage.setItem(ID_KEY,JSON.stringify({operador,dispositivo}));updateIdentity()};
  setInterval(()=>{$('clock').textContent=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);checkVersion();updateIdentity();loadIndex();
</script></body></html>
