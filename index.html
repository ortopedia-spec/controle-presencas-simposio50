<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ed1c2e"><link rel="manifest" href="manifest.json">
  <title>Simpósio 50 Anos — Presenças</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    :root{--red:#ed1c2e;--red-deep:#d61125;--red-soft:#fff0f2;--ink:#111319;--muted:#55627a;--line:#e5e8ef;--bg:#fff;--ok:#22a842;--warn:#a96100;--bad:#b7192a;--orange:#ff891e;--yellow:#ffd61b}*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);font:16px system-ui,-apple-system,Segoe UI,sans-serif;color:var(--ink);position:relative}.decor{position:fixed;z-index:0;pointer-events:none;border-radius:50%;opacity:.9}.decor-top{width:210px;height:210px;right:-64px;top:-96px;border:18px solid var(--orange);border-left-color:var(--yellow);border-bottom-color:transparent;transform:rotate(18deg)}.decor-bottom{width:205px;height:205px;left:-112px;bottom:-108px;border:18px solid var(--red);border-top-color:var(--orange);border-right-color:transparent;transform:rotate(-28deg)}main{max-width:680px;margin:auto;padding:14px 14px 34px;position:relative;z-index:1}header{padding:6px 5px 10px}.brand{display:flex;align-items:center;gap:7px;min-height:88px}.brand-symbol{width:91px;height:60px;object-fit:contain;flex:0 0 auto}.brand-anniversary{width:61px;height:77px;object-fit:contain;flex:0 0 auto;transform:scale(1.08)}.brand-copy{min-width:0;padding-left:2px}h1{font-size:32px;line-height:.9;margin:0;color:#090b0e;font-weight:850;letter-spacing:-1.4px}.title-years{display:block;color:var(--red);margin-top:6px}.sub{color:var(--muted);margin-top:5px;font-size:17px;line-height:1.05}.meta{margin-top:9px;padding:11px 14px;background:var(--red-soft);border-radius:999px;color:#4d5870;font-size:14px;display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:nowrap}.meta span{display:flex;align-items:center;gap:5px;white-space:nowrap}.operator-wrap{display:block!important;flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.meta .meta-icon{color:var(--red);font-size:18px;line-height:1}.meta b{color:#111319}.clock-wrap{padding-left:9px;border-left:1px solid #d6bac0;flex:0 0 auto}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:11px;margin-top:13px;box-shadow:0 5px 18px #1018280c}.scanner-card{padding:0;border:0;box-shadow:none;background:transparent}.scanner-card:has(#reader:empty){padding-bottom:0}#reader{overflow:hidden;border-radius:18px;min-height:0;background:#17191f}#reader:empty{display:none}#reader:not(:empty){height:clamp(185px,28vh,230px);margin-bottom:9px;border:1px solid var(--line)}#reader video,#reader img{width:100%!important;height:100%!important;object-fit:cover;border-radius:17px}.actions{display:flex;gap:8px}.actions button{flex:1}button,input{font:inherit}button{border:0;border-radius:16px;padding:12px 16px;background:var(--red);color:#fff;font-weight:800;min-height:58px;cursor:pointer;box-shadow:0 5px 12px #ed1c2e2e}button#start{font-size:20px;text-align:left;position:relative;padding-left:23px;background:linear-gradient(135deg,var(--red),var(--red-deep))}button#start:after{content:"›";font-size:40px;font-weight:300;line-height:20px;position:absolute;right:22px;top:16px}button#start:before{content:"";position:absolute;right:60px;top:14px;width:42px;height:24px;border-radius:50%;border:10px solid #ffffff22;border-left-color:transparent;transform:rotate(18deg)}button.stop{background:#8f3c42}button:disabled{opacity:.55;cursor:wait}.search-card{padding:10px}.search{display:flex;align-items:stretch;gap:9px;position:relative}.search:before{content:"⌕";position:absolute;left:18px;top:5px;color:#384661;font-size:37px;line-height:42px;z-index:1}.search input{min-width:0;flex:1;border:1px solid #dbe0e9;border-radius:15px;padding:11px 12px 11px 53px;min-height:58px;color:#111319;font-size:18px;background:#fff}.search input:focus{outline:2px solid #ed1c2e55;border-color:var(--red)}.search button{flex:0 0 auto;min-width:115px;background:var(--red);min-height:58px;font-size:18px}.result{border-left:6px solid var(--ok);padding:15px;background:#f3fbf6;border-radius:10px;margin-top:12px}.result.warn{border-color:#e4a230;background:#fff8e9}.result.error{border-color:var(--bad);background:#fff3f2}.result h2{margin:0 0 6px;font-size:20px}.result .person{font-size:24px;font-weight:800}.detail{color:#4f645c;margin-top:4px}.list{display:grid;gap:8px;margin-top:12px}.person-card{border:1px solid var(--line);padding:18px 14px 14px 82px;border-radius:20px;position:relative;min-height:105px;box-shadow:0 5px 18px #1018280a}.person-card:before{content:"●";position:absolute;left:17px;top:18px;width:48px;height:48px;display:grid;place-items:center;border-radius:50%;background:var(--red-soft);color:var(--red);font-size:34px;line-height:1}.person-card strong{display:block;font-size:22px;line-height:1.05}.person-card small{display:block;color:var(--muted);font-size:16px;line-height:1.2;margin:6px 0 13px}.person-card button{width:calc(100% + 68px);margin-left:-68px;min-height:54px;border-radius:14px;font-size:18px;position:relative}.person-card button:before{content:"+";font-size:26px;margin-right:12px}.person-card button:after{content:"›";font-size:36px;font-weight:300;line-height:20px;position:absolute;right:18px;top:15px}.hidden{display:none!important}.overlay{position:fixed;inset:0;background:#0009;z-index:20;display:flex;align-items:center;justify-content:center;padding:18px}.modal{width:min(100%,420px);background:#fff;border-radius:16px;padding:20px}.modal h2{margin:0}.modal p{color:var(--muted)}.modal label{font-size:13px;font-weight:700;display:block;margin-top:11px}.modal input{width:100%;border:1px solid var(--line);padding:12px;border-radius:9px;margin-top:4px}.modal button{width:100%;margin-top:15px}.status{font-size:14px;color:var(--muted);margin:15px 3px 0;text-align:center}.status.ready:before,.status.warning:before{content:"";display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:9px;vertical-align:-1px}.status.ready:before{background:var(--ok)}.status.warning:before{background:var(--warn)}@media(max-width:380px){main{padding:10px 10px 28px}.brand{gap:4px;min-height:80px}.brand-symbol{width:78px;height:53px}.brand-anniversary{width:54px;height:66px}h1{font-size:27px}.sub{font-size:15px}.meta{font-size:12px;padding:9px 11px;gap:4px}.meta .meta-icon{font-size:15px}.clock-wrap{padding-left:6px}.search{gap:7px}.search input{font-size:16px;padding-left:45px}.search:before{left:14px;font-size:32px}.search button{min-width:94px;font-size:16px;padding-inline:10px}.person-card{padding-left:73px}.person-card:before{left:14px}.person-card button{width:calc(100% + 59px);margin-left:-59px;font-size:16px}#reader:not(:empty){height:185px}}@media(max-width:335px){.meta{flex-wrap:wrap;border-radius:22px}.clock-wrap{padding-left:0;border-left:0}}
    /* Máscara institucional aprovada: os controles abaixo continuam sendo HTML responsivo. */
    .decor{display:none}.identity-footer{position:fixed;z-index:0;left:0;bottom:0;width:100%;height:auto;pointer-events:none;user-select:none}.identity-footer img{display:block;width:100%;height:auto}.brand{display:block;min-height:0}.identity-header{display:block;width:100%;height:auto;max-width:620px;margin:0 auto}.brand-symbol,.brand-anniversary,.brand-copy{display:none}main{padding-top:0}header{padding-top:0}.meta{margin-top:3px}@media(max-width:380px){.brand{min-height:0}.identity-header{width:100%}}
  </style>
</head>
<body><img class="identity-footer" src="assets/identidade-rodape.png" alt="" aria-hidden="true"><main>
  <header><div class="brand"><img class="identity-header" src="assets/identidade-cabecalho.png?v=2026.09.12.8" alt="Simpósio 50 Anos — Controle de Presenças"></div><div class="meta"><span class="operator-wrap"><span class="meta-icon" aria-hidden="true">●</span>Operador: <b id="operator">—</b> · <b id="device">—</b></span><span class="clock-wrap"><span class="meta-icon" aria-hidden="true">□</span><span id="clock">—</span></span></div></header>
  <section class="card scanner-card"><div id="reader"></div><div class="actions"><button id="start">📷 Iniciar câmera</button><button id="stop" class="stop hidden">■ Parar câmera</button></div></section>
  <section class="card search-card"><div class="search"><input id="search" autocomplete="off" placeholder="Buscar participante" aria-label="Buscar participante"><button id="searchBtn" class="secondary">Buscar</button></div><div id="matches" class="list"></div></section>
  <div id="feedback" class="hidden"></div><div class="status" id="status">Preparando base local…</div>
</main>
<div class="overlay hidden" id="identity"><div class="modal"><h2>Identificação</h2><p>Informe uma vez para este aparelho.</p><label for="operatorInput">Operador</label><input id="operatorInput" maxlength="80" autocomplete="name"><label for="deviceInput">Dispositivo</label><input id="deviceInput" maxlength="80" placeholder="Ex.: Celular 01"><button id="saveIdentity">Continuar</button></div></div>
<script>
  const API_URL='https://script.google.com/macros/s/AKfycbyr6Uu1NE2M6UE3i2X92qNQgih3Ky9OCAYpXqmo3L2fGry2GhIGVPn43mDOp_IFd1Cl/exec';
  const APP_VERSION='2026.09.12.8', CACHE_KEY='simposio50.indice.'+APP_VERSION, ID_KEY='simposio50.identidade';
  let scanner=null, scanning=false, busy=false, identity={}, localIndex=null;
  const $=id=>document.getElementById(id), escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  async function api(action, body={}){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,...body})});const j=await r.json();if(!j.ok)throw new Error(j.error?.message||'Falha na comunicação.');return j.data}
  function norm(s){return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim()}
  function indiceCompativel(cached,baseVersion){return !!cached&&cached.appVersion===APP_VERSION&&String(cached.baseVersion)===String(baseVersion)&&Array.isArray(cached.pessoas)&&!!cached.inscricaoParaPessoa&&typeof cached.inscricaoParaPessoa==='object'&&cached.pessoas.every(p=>p&&['nome','nomeCracha','nomeExibicao'].every(c=>typeof p[c]==='string'))}
  function filtrarIndiceLocal(indice,termo){const partes=norm(termo).split(' ').filter(Boolean);return !indice||!partes.length?[]:indice.pessoas.filter(p=>partes.every(x=>norm([p.nome,p.nomeCracha,p.nomeExibicao].join(' ')).includes(x))).slice(0,30)}
  async function buscarComFallback(termo,indice,consultar){const locais=filtrarIndiceLocal(indice,termo);return locais.length?locais:consultar(termo)}
  function updateIdentity(){identity=JSON.parse(localStorage.getItem(ID_KEY)||'{}');$('operator').textContent=identity.operador||'—';$('device').textContent=identity.dispositivo||'—';$('identity').classList.toggle('hidden',!!(identity.operador&&identity.dispositivo))}
  function show(message,kind='ok',person='',detail=''){const el=$('feedback');el.className='result '+(kind==='warn'?'warn':kind==='error'?'error':'');el.innerHTML='<h2>'+message+'</h2>'+(person?'<div class="person">'+escape(person)+'</div>':'')+(detail?'<div class="detail">'+escape(detail)+'</div>':'');}
  function clearFeedback(){ $('feedback').className='hidden'; $('feedback').innerHTML=''; }
  async function checkVersion(){try{const v=await fetch('version.json',{cache:'no-store'}).then(r=>r.json());if(v.version&&v.version!==APP_VERSION&&!location.search.includes('v='+encodeURIComponent(v.version)))location.replace(location.pathname+'?v='+encodeURIComponent(v.version));}catch(_){} }
  function setStatus(message,kind=''){const el=$('status');el.textContent=message;el.className='status '+kind}
  async function loadIndex(){let cached=null;try{cached=JSON.parse(localStorage.getItem(CACHE_KEY)||'null')}catch(_){}try{const status=await api('obterBaseVersion');if(indiceCompativel(cached,status.baseVersion)){localIndex=cached;setStatus('Base local pronta','ready');return}const fresh=await api('obterIndiceParticipantes'),atualizado={...fresh,appVersion:APP_VERSION};localStorage.setItem(CACHE_KEY,JSON.stringify(atualizado));localIndex=atualizado;setStatus('Base atualizada','ready');}catch(e){if(indiceCompativel(cached,cached?.baseVersion)){localIndex=cached;setStatus('Usando base local; servidor indisponível','warning')}else{setStatus('Base será consultada no servidor','warning')}}}
  function normalizarQrLido(decoded){const bruto=String(decoded??'').trim();if(/^\d+$/.test(bruto))return bruto;try{const url=new URL(bruto),match=url.hostname.toLowerCase()==='e3.gl'&&url.pathname.match(/^\/[a-f0-9]{8}(\d{8})$/i);return match?match[1]:bruto}catch(_){return bruto}}
  function fromLocal(number){const hit=localIndex?.inscricaoParaPessoa?.[String(number).replace(/\s/g,'')];if(!hit)return null;const p=localIndex.pessoas.find(x=>x.idPessoa===hit.idPessoa);return p?{...p,numeroInscricaoLido:number,categoriaInscricaoLida:hit.categoria}:null}
  async function processQR(decoded){if(busy)return;busy=true;clearFeedback();const qr=normalizarQrLido(decoded);show('Consultando…','ok');try{const p=fromLocal(qr)||await api('buscarPorInscricao',{numeroInscricao:qr});await register({origemRegistro:'QR',numeroInscricao:qr},p)}catch(e){show('❌ QR não localizado','error','',e.message);rearm(2200)}}
  function manterFeedbackDuplicado_(status){return status==='DUPLICADA'}
  async function register(payload,person){try{const r=await api('registrarPresenca',{...payload,operador:identity.operador,dispositivo:identity.dispositivo});const p=r.participante||person;const d=r.presenca;if(manterFeedbackDuplicado_(r.status)){show('⚠️ Presença já registrada','warn',p.nomeExibicao,'Registro original: '+d.data+' · '+d.hora+' · '+d.periodo);$('matches').innerHTML='';busy=false;return}show('✅ Presença registrada','ok',p.nomeExibicao,d.data+' · '+d.periodo+' · '+d.hora);$('matches').innerHTML='';rearm(2100)}catch(e){show('❌ Não foi possível registrar','error',person?.nomeExibicao||'',e.message);rearm(2500)}}
  function rearm(ms){setTimeout(()=>{busy=false;if(scanning)clearFeedback()},ms)}
  async function start(){if(scanning)return;try{scanner=new Html5Qrcode('reader');await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:240,height:240}},processQR,()=>{});scanning=true;$('start').classList.add('hidden');$('stop').classList.remove('hidden');}catch(e){show('❌ Câmera indisponível','error','',e.message)}}
  async function stop(){if(!scanner)return;try{await scanner.stop();await scanner.clear()}finally{scanner=null;scanning=false;$('start').classList.remove('hidden');$('stop').classList.add('hidden')}}
  async function search(){const q=$('search').value.trim();if(q.length<2){show('Digite ao menos 2 caracteres','error');return}clearFeedback();try{const people=await buscarComFallback(q,localIndex,async termo=>(await api('buscarParticipantes',{termo})).participantes);renderMatches(people)}catch(e){show('❌ Busca indisponível','error','',e.message)}}
  function renderMatches(people){const box=$('matches');if(!people.length){box.innerHTML='<div class="detail">Nenhum participante encontrado.</div>';return}box.innerHTML=people.map((p,i)=>'<div class="person-card"><strong>'+escape(p.nomeExibicao)+'</strong>'+(p.nome&&p.nome!==p.nomeExibicao?'<small>Cadastro: '+escape(p.nome)+'</small>':'')+'<button data-index="'+i+'">REGISTRAR PRESENÇA</button></div>').join('');box.querySelectorAll('button').forEach(b=>b.onclick=()=>register({origemRegistro:'BUSCA_NOME',idPessoa:people[Number(b.dataset.index)].idPessoa},people[Number(b.dataset.index)]))}
  $('start').onclick=start;$('stop').onclick=stop;$('searchBtn').onclick=search;$('search').onkeydown=e=>{if(e.key==='Enter')search()};$('saveIdentity').onclick=()=>{const operador=$('operatorInput').value.trim(),dispositivo=$('deviceInput').value.trim();if(!operador||!dispositivo)return;$('operatorInput').value='';localStorage.setItem(ID_KEY,JSON.stringify({operador,dispositivo}));updateIdentity()};
  setInterval(()=>{$('clock').textContent=new Date().toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit'})},1000);checkVersion();updateIdentity();loadIndex();
</script></body></html>
